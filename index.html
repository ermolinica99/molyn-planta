<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MOLYN · Planta</title>
<style>
:root{
  --ink:#1B1A17; --bg:#F4F2ED; --surf:#FFFFFF; --surf2:#EAE7E0;
  --terra:#B85C38; --terra-d:#A04E2E; --green:#4C9A5E; --red:#C0492B;
  --blue:#5A7D8C; --muted:#8A857C; --border:#E4E0D8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Segoe UI',system-ui,Arial,sans-serif}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);overflow-x:hidden}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none}

/* ---------- cabecera ---------- */
header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
header .brand{font-weight:800;letter-spacing:1px;font-size:18px}
header .who{font-size:13px;color:#C9C4BA;display:flex;align-items:center;gap:12px}
header .who b{color:#fff}
.logout{background:rgba(255,255,255,.1);color:#fff;border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600}

/* ---------- login ---------- */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:22px}
.logo{text-align:center}
.logo h1{font-size:34px;font-weight:800;letter-spacing:2px;margin:0;color:var(--ink)}
.logo p{color:var(--muted);letter-spacing:3px;margin:4px 0 0;font-size:12px}
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:100%;max-width:640px}
.ucard{background:var(--surf);border:1px solid var(--border);border-radius:16px;padding:20px;text-align:center;transition:.12s;box-shadow:0 6px 18px rgba(30,25,20,.05)}
.ucard:active{transform:scale(.97)}
.ucard.sel{border-color:var(--terra);box-shadow:0 0 0 2px var(--terra)}
.ucard .av{width:52px;height:52px;border-radius:16px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
.ucard .nm{font-weight:700;font-size:15px}
.ucard .rl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

/* PIN */
#pinpad{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;gap:18px}
.pin-dots{display:flex;gap:14px}
.pin-dots i{width:16px;height:16px;border-radius:50%;background:var(--surf2);border:1px solid var(--border);display:block}
.pin-dots i.on{background:var(--terra);border-color:var(--terra)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.keys button{background:var(--surf);border:1px solid var(--border);border-radius:16px;font-size:26px;font-weight:600;padding:20px 0;box-shadow:0 4px 12px rgba(30,25,20,.05)}
.keys button:active{background:var(--surf2)}
.keys .wide{grid-column:span 1}
.pin-name{font-weight:700;font-size:17px}
.pin-err{color:var(--red);font-weight:600;min-height:20px;font-size:14px}
.back{background:none;color:var(--muted);font-weight:600;font-size:14px}

/* ---------- vistas ---------- */
main{padding:20px;max-width:900px;margin:0 auto}
.placeholder{background:var(--surf);border:1px solid var(--border);border-radius:16px;padding:40px 24px;text-align:center;color:var(--muted);margin-top:24px}
.placeholder h2{color:var(--ink);margin:0 0 8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;opacity:0;transition:.2s;z-index:100;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.toast.err{background:var(--red)}.toast.ok{background:var(--green)}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<section id="login">
  <div class="logo"><h1>MOLYN</h1><p>PLANTA · NÚCLEOS</p></div>

  <div id="userStep" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:16px">
    <div style="color:var(--muted);font-weight:600">Selecciona tu usuario</div>
    <div class="users" id="usersList"></div>
  </div>

  <div id="pinStep" class="hidden">
    <div id="pinpad">
      <div class="pin-name" id="pinName">—</div>
      <div class="pin-dots" id="pinDots"></div>
      <div class="pin-err" id="pinErr"></div>
      <div class="keys" id="keys"></div>
      <button class="back" onclick="Login.back()">← Cambiar usuario</button>
    </div>
  </div>
</section>

<!-- ================= APP (tras login) ================= -->
<div id="app" class="hidden">
  <header>
    <div class="brand">MOLYN · PLANTA</div>
    <div class="who"><span id="whoName">—</span><button class="logout" onclick="Login.logout()">Salir</button></div>
  </header>

  <!-- vista operario -->
  <main id="viewOperario" class="hidden">
    <div class="placeholder">
      <h2>Vista Operario</h2>
      <p>Escaneo de fabricación con cronómetro y paradas.<br>Próxima entrega.</p>
    </div>
  </main>

  <!-- vista encargado -->
  <main id="viewEncargado" class="hidden">
    <div class="placeholder">
      <h2>Vista Encargado</h2>
      <p>Consumo, stock, ritmo del operario, inventario (con aprobación), etiquetas y partes.<br>Próxima entrega.</p>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://kmfdywyeesybqqfmfxys.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImttZmR5d3llZXN5YnFxZm1meHlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNTA0MDMsImV4cCI6MjA5OTgyNjQwM30.dDrPPvqxqWBqFTA5FNC3YLAVK53nm8V2tn5JKHN9ve4";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = s => document.querySelector(s);
function toast(msg, type){const t=$('#toast');t.textContent=msg;t.className='toast show '+(type||'');setTimeout(()=>t.className='toast',1800)}

const AV_COLORS = {operario:['#F5E7DF','#B85C38'], encargado:['#E4EDF0','#5A7D8C']};

const Login = {
  users: [], sel: null, pin: '',
  async init(){
    // sesión recordada
    const saved = sessionStorage.getItem('molyn_user');
    if(saved){ this.enter(JSON.parse(saved)); return; }
    try{
      const {data, error} = await sb.from('usuarios').select('id,nombre,rol,pin').eq('activo',true).order('rol').order('nombre');
      if(error) throw error;
      this.users = data || [];
      this.renderUsers();
    }catch(e){ toast('No se pudo conectar: '+e.message,'err'); }
  },
  renderUsers(){
    const c = $('#usersList');
    c.innerHTML = this.users.map((u,i)=>{
      const [bg,fg] = AV_COLORS[u.rol]||AV_COLORS.operario;
      const ini = (u.nombre||'?').trim().charAt(0).toUpperCase();
      return `<div class="ucard" onclick="Login.pick(${i})">
        <div class="av" style="background:${bg};color:${fg}">${ini}</div>
        <div class="nm">${esc(u.nombre)}</div>
        <div class="rl">${u.rol}</div></div>`;
    }).join('');
  },
  pick(i){
    this.sel = this.users[i]; this.pin='';
    $('#userStep').classList.add('hidden');
    $('#pinStep').classList.remove('hidden');
    $('#pinName').textContent = this.sel.nombre;
    $('#pinErr').textContent='';
    this.renderPad(); this.renderDots();
  },
  renderPad(){
    const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
    $('#keys').innerHTML = keys.map(k=>{
      if(k==='') return `<div></div>`;
      return `<button onclick="Login.key('${k}')">${k}</button>`;
    }).join('');
  },
  renderDots(){
    const n = this.sel ? Math.max(4, (this.sel.pin||'').length) : 4;
    let h=''; for(let i=0;i<n;i++) h+=`<i class="${i<this.pin.length?'on':''}"></i>`;
    $('#pinDots').innerHTML = h;
  },
  key(k){
    if(k==='⌫'){ this.pin=this.pin.slice(0,-1); }
    else if(this.pin.length < 8){ this.pin+=k; }
    this.renderDots();
    if(this.pin.length === (this.sel.pin||'').length) this.check();
  },
  check(){
    if(this.pin === String(this.sel.pin)){
      const u = {id:this.sel.id, nombre:this.sel.nombre, rol:this.sel.rol};
      sessionStorage.setItem('molyn_user', JSON.stringify(u));
      this.enter(u);
    }else{
      $('#pinErr').textContent = 'PIN incorrecto';
      this.pin=''; this.renderDots();
    }
  },
  back(){
    this.sel=null; this.pin='';
    $('#pinStep').classList.add('hidden');
    $('#userStep').classList.remove('hidden');
  },
  enter(u){
    $('#login').classList.add('hidden');
    $('#app').classList.remove('hidden');
    $('#whoName').innerHTML = `<b>${esc(u.nombre)}</b> · ${u.rol}`;
    $('#viewOperario').classList.toggle('hidden', u.rol!=='operario');
    $('#viewEncargado').classList.toggle('hidden', u.rol!=='encargado');
  },
  logout(){
    sessionStorage.removeItem('molyn_user');
    location.reload();
  }
};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

Login.init();
</script>
</body>
</html>
